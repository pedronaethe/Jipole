[physical]
MBH = 4.14e6 # Mass of the BH in solar masses.
slow_light = false # Evolve imaging using slow light. When true, dump_filepath below must be a directory.
m_unit = 2.679361e+17 # Mass scale of the disk. Any float number of "MAD", "SANE". If "flux_fit" is on, it will use this as first guess.

[dump]
dump_filepath = "test/data/tiny_dump.h5" # dump_filepath can point to a single dump file, or to a directory of dumps. If path is a directory, it will try to image all the files in it.
t_init = 3000 # Which simulation time to start if dump_filepath is a repository.
t_final = 6000 # Which simualtion time to end if dump_filepath is a repository.

# Fast light on an observer-time cadence. Optional: without it, fast light
# renders one image per dump at that dump's own time, as before. With it, frames
# are placed on a time grid and the fluid is interpolated between the two dumps.
[fastlight]
# cadence = 10.0
# t_start = 11800.0
# n_frames = 10

[slowlight]
image_cadence = 10.0
#either cpu or gpu
engine = "cpu"

[brisklight]
on = false
p = 0.5
n_bands = 2        # Highest lensing band tracked.
cadence = 10.0     # Time (given in M) between frames, in observer time.
# t_start = 11810.0  # Optional: time of the first frame's n = 0 image.
# n_frames = 10      # Optional: stop after this many frames.
# interval = shortest # Optional: "hdi" (default: the paper's modal highest-density interval) or "shortest" (the shortest interval containing the mode and a fraction p of the sample; see Brisklight.modal_hdi).
sample_stride = 1  # screen subsampling of the crossing-time sample (every pixel; see Brisklight.BandSample)
interpolate_bands = true  # false: clip each step into its band's interval (the paper's prescription)
grouping = "nearest_crossing"  # or "segment"; which band each step is rendered in (matters only with interpolate_bands = false)
engine = "cpu"

[gradient]
on = false # Enable or disable gradient calculations.
wrt = ["M_unit", "Rhigh"] # any of: MBH, Rhigh, Rlow, beta_crit, th_beg, sigma_cut, sigma_cut_high, M_unit, ro, th, phi, sourceD

[polarization]
on = true # Enable or disable polarization calculations.

[plasma]
Rhigh = 160.0 # Tp/Te at the high beta region.
Rlow = 1.0 # Tp/Te at the low beta region.
beta_crit = 1.0 # Critical beta value for the plasma to transition between low and high beta regions.
th_beg = 1.74e-2 # Excise the pole
sigma_cut = 1.0 # Sigma cut for the plasma.
sigma_cut_high = -1.0 # Sigma cut for the high beta region.
# rmin_geo = 1.0     # optional: inner edge of the emitting region
# rmax_geo = 100.0   # optional: outer edge.

[camera]
ro = 1000.0 # Distance of the observer from the black hole in units of M.
theta_o = 30.0 # Polar angle of the observer relative to the black hole, in degrees.
phi = 0.0 # Azimuthal angle of the observer relative to the black hole, in degrees.

[image]
pixels_x = 1024 # Number of pixels in the x-direction.
pixels_y = 1024 # Number of pixels in the y-direction.
fov_size = 200.0 # Field of view size in units of microarcseconds (muas).
xoff = 0.0 # Offset of the image in the x-direction.
yoff = 0.0 # Offset of the image in the y-direction.

[observing]
freq = 230e9 # Observing frequency in Hz.
source_distance_pc = 8.127e3 # Distance to the source in parsecs.

[raytracing]
maxnstep = 8000 # Maximum number of steps for the raytracing algorithm.
mode = "cpu" # Compute mode for the raytracing algorithm (cpu or gpu).

[fit]
flux_fit = false # Enable or disable flux fitting. This will fit M_unit to match the target flux.
flux_value = 2.4     # Target mean flux, Jy
fitting_res = 80      # Image resolution used during the fit
fit_amount = 100      # Number of evenly spaced dumps averaged (all of them if there are fewer)
fit_save = false      # Also write the fit images to <output folder>/fit/
fitting_tol = 0.03    # Stop when the mean flux is within 3% of flux_value

[output]
filename = "results/mad_beta10/jipole_output.h5" # Output filename for the results.
format = "ipole" # Output format for the results.