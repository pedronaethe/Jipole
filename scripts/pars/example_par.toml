[physical]
MBH = 4.14e6
# When true, dump_filepath below must be a directory: the whole
# t_init..t_final range is used as the slow-light dump sequence (see
# [slowlight]) instead of one image per dump.
slow_light = false

#it can be MAD/SANE or any float value
m_unit = 2.679361e+17

[dump]
# dump_filepath can point to a single dump file, or to a directory of dumps.
dump_filepath = "test/data/tiny_dump.h5"

#These parameters are only read when dump_filepath reads a directory with multiple dumps inside.
t_init = 3000
t_final = 6000

# Only read when [physical].slow_light = true.
[slowlight]
image_cadence = 10.0
#either cpu or gpu
engine = "cpu"


[gradient]
# here, we set up the kind of gradients we want to calculate. 
# options: Rhigh, m_unit, 
on = false
# any of: MBH, Rhigh, Rlow, beta_crit, th_beg, sigma_cut, sigma_cut_high, M_unit, ro, th, phi, sourceD
wrt = ["M_unit", "Rhigh"]

[polarization]
# Polarized transfer: also compute Stokes Q, U, V and the Faraday depth, as ipole does without
# -unpol. The output file then holds them in "pol", next to the unpolarized image "unpol".
# Works with mode = "cpu" (also with [gradient]) and mode = "gpu"; not with slow light.
# This whole section is optional: leaving it out is the same as on = false.
on = false

[plasma]
Rhigh = 160.0
Rlow = 1.0
beta_crit = 1.0
th_beg = 1.74e-2
sigma_cut = 1.0
sigma_cut_high = -1.0

[camera]
ro = 1000.0
theta_o = 30.0
phi = 0.0

[image]
pixels_x = 2048
pixels_y = 2048
fov_size = 200.0
xoff = 0.0
yoff = 0.0

[observing]
freq = 230e9
source_distance_pc = 8.127e3

[raytracing]
maxnstep = 8000

#either cpu or gpu
mode = "gpu"

[fit]
flux_fit = false
flux_value = 2.4     # target mean flux, Jy
fitting_res = 80      # image resolution used during the fit
fit_amount = 100      # number of evenly spaced dumps averaged (all of them if there are fewer)
fit_save = false      # also write the fit images to <output folder>/fit/
fitting_tol = 0.03    # stop when the mean flux is within 3% of flux_value

[output]
#if the directory does not exist, it will create it.
#with slowlight on, the results are saved in a slow_sims folder.
filename = "results/mad_beta10/jipole_output.h5"
format = "ipole"