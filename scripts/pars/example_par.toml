[physical]
MBH = 4.14e6
# When true, dump_filepath below must be a directory: the whole
# t_init..t_final range is used as the slow-light dump sequence (see
# [slowlight]) instead of one image per dump.
slow_light = false

#it can be MAD/SANE or any float value
m_unit = 2.679361e+17

[dump]
# dump_filepath can point to a single dump file, or to a directory of dumps.
dump_filepath = "test/data/tiny_dump.h5"

#These parameters are only read when dump_filepath reads a directory with multiple dumps inside.
t_init = 3000
t_final = 6000

# Only read when [physical].slow_light = true.
[slowlight]
image_cadence = 10.0
#either cpu or gpu
engine = "cpu"


# Brisk light: slow-light geometry at reduced temporal fidelity. Only read when
# [brisklight].on = true, and mutually exclusive with [physical].slow_light.
#
# p is the retained probability mass of each lensing band's emission-time
# distribution. It is the only knob, and it controls how many dump files each
# band uses *through the geometry*: p sets the width of the band's retained
# interval, and the dumps needed are the ones bracketing it -- 1 if the band
# lands on a dump time, 2 if it falls between dumps, about ceil(width/dT)+1 in
# general. There is deliberately no "snapshots per band" parameter; it is
# derived, and exposing it would let you contradict p.
#   p = 0  -> each band evaluated at its modal emission time
#   p = 1  -> clipping disabled; reduces to slow light
#
# Band times are synchronized at n = 0: a frame's time is the time of its n = 0
# image, so with a cadence that is a multiple of the dump spacing the n = 0 band
# reads exactly the dump fast light would. Bands n > 0 keep their physical delay
# offset and interpolate between their two nearest snapshots.
[brisklight]
on = false
p = 0.5
n_bands = 2        # highest lensing band tracked (n = 0 .. n_bands)
cadence = 10.0     # M between frames, in observer time
# t_start = 11810.0  # optional: time of the first frame's n = 0 image
# n_frames = 10      # optional: stop after this many frames
sample_stride = 4  # screen subsampling for the emission-time distribution
weighting = "emission"  # "emission" (j*dl), "steps" or "length"; see src/brisklight.jl
engine = "cpu"

# Fast light on an observer-time cadence. Optional: without it, fast light
# renders one image per dump at that dump's own time, as before. With it, frames
# are placed on a time grid and the fluid is interpolated between the two dumps
# bracketing each one -- so a fast-light run can share a frame grid with a brisk
# or slow-light run and be compared to it directly. Requires a dump directory.
[fastlight]
# cadence = 10.0
# t_start = 11800.0
# n_frames = 10

[gradient]
# here, we set up the kind of gradients we want to calculate. 
# options: Rhigh, m_unit, 
on = false
# any of: MBH, Rhigh, Rlow, beta_crit, th_beg, sigma_cut, sigma_cut_high, M_unit, ro, th, phi, sourceD
wrt = ["M_unit", "Rhigh"]

[plasma]
Rhigh = 160.0
Rlow = 1.0
beta_crit = 1.0
th_beg = 1.74e-2
sigma_cut = 1.0
sigma_cut_high = -1.0
# rmin_geo = 1.0     # optional: inner edge of the emitting region
# rmax_geo = 100.0   # optional: outer edge. Smaller values shrink the span of
                     # emission times a ray samples, and so how many snapshots a
                     # slow- or brisk-light frame must hold.

[camera]
ro = 1000.0
theta_o = 30.0
phi = 0.0

[image]
pixels_x = 2048
pixels_y = 2048
fov_size = 200.0
xoff = 0.0
yoff = 0.0

[observing]
freq = 230e9
source_distance_pc = 8.127e3

[raytracing]
maxnstep = 8000

#either cpu or gpu
mode = "gpu"

[fit]
flux_fit = false
flux_value = 2.4     # target mean flux, Jy
fitting_res = 80      # image resolution used during the fit
fit_amount = 100      # number of evenly spaced dumps averaged (all of them if there are fewer)
fit_save = false      # also write the fit images to <output folder>/fit/
fitting_tol = 0.03    # stop when the mean flux is within 3% of flux_value

[output]
#if the directory does not exist, it will create it.
#with slowlight on, the results are saved in a slow_sims folder.
filename = "results/mad_beta10/jipole_output.h5"
format = "ipole"