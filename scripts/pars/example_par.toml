[physical]
MBH = 4.14e6 # Mass of the BH, sets the length and time scales
m_unit = 2.679361e+17 # 1 density code unit to g/cm^3

[dump]
dump_filepath = "test/data/tiny_dump.h5" # dump_filepath can point to a single dump file, or to a directory of dumps.

#These parameters are only read when dump_filepath reads a directory with multiple dumps inside.
t_init = 3000
t_final = 6000


[slowlight]
on = false
image_cadence = 10.0


[brisklight]
on = false
p = 0.5          # fraction of each band's crossing times its window holds (0 = one time per band, 1 = slow light)
n_bands = 2      # highest lensing band, counted in turns of z = r cos θ
cadence = 10.0   # M between frames
# t_start = ...  # optional: time of the first frame (fluid time of the direct image)
# n_frames = ... # optional

# In case you want fastlight movies interpolating between frames, in case the cadence < your snapshot dt.
[fastlight]
cadence = 10.0   # fast light on a cadence, interpolating between dumps; t_start and n_frames as above


[gradient]
# here, we set up the kind of gradients we want to calculate. 
# options: Rhigh, m_unit, 
on = false
# any of: MBH, Rhigh, Rlow, beta_crit, th_beg, sigma_cut, sigma_cut_high, M_unit, ro, th, phi, sourceD
wrt = ["M_unit", "Rhigh"]

[polarization]
# Polarized transfer: also compute Stokes Q, U, V and the Faraday depth, as ipole does without
# -unpol. The output file then holds them in "pol", next to the unpolarized image "unpol".
# Works with mode = "cpu" (also with [gradient]) and mode = "gpu"; not with slow light.
# This whole section is optional: leaving it out is the same as on = false.
on = true

[plasma]
Rhigh = 160.0
Rlow = 1.0
beta_crit = 1.0
th_beg = 1.74e-2
sigma_cut = 1.0
sigma_cut_high = -1.0

[camera]
ro = 1000.0
theta_o = 30.0
phi = 0.0

[image]
pixels_x = 1024
pixels_y = 1024
fov_size = 200.0
xoff = 0.0
yoff = 0.0

[observing]
freq = 230e9
source_distance_pc = 8.127e3

[raytracing]
maxnstep = 8000
mode = "cpu" # cpu or gpu, for every mode: fast, slow and brisk light.

[fit]
flux_fit = false
flux_value = 2.4     # target mean flux, Jy
fitting_res = 80      # image resolution used during the fit
fit_amount = 100      # number of evenly spaced dumps averaged (all of them if there are fewer)
fit_save = false      # also write the fit images to <output folder>/fit/
fitting_tol = 0.03    # stop when the mean flux is within 3% of flux_value

[output]
filename = "results/mad_beta10/jipole_output.h5"
format = "ipole"
# max_lens = 2   # also save the image split by lensing band 0..2 in turns of z.